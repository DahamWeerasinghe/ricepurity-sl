<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Rice Purity Score</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1129729226761208"
     crossorigin="anonymous"></script>
  <style>
      body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    h1 {
      color: #58a6ff;
      font-size: 2.5em;
      margin-bottom: 30px;
    }

    .score {
      font-size: 4em;
      font-weight: bold;
      color: #58a6ff;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 30px;
      color: #58a6ff;
      background-color: #161b22;
      padding: 10px 16px;
      border: 2px solid #58a6ff;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
    }

    .message-box {
      background-color: #161b22;
      border-left: 4px solid #58a6ff;
      padding: 20px;
      border-radius: 8px;
      max-width: 700px;
      text-align: left;
      box-shadow: 0 0 15px rgba(88, 166, 255, 0.1);
      margin-bottom: 30px;
    }

    .message-box p {
      line-height: 1.6;
      margin: 0;
    }

    .image-frame {
      margin-top: 20px;
      border: 4px solid #58a6ff;
      padding: 5px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(88, 166, 255, 0.3);
      background-color: #161b22;
      max-width: 320px;
    }

    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }

    .retry-link {
      color: #58a6ff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1em;
      background-color: #21262d;
      padding: 10px 20px;
      border-radius: 6px;
      transition: 0.3s ease;
      margin-top: 30px;
    }

    .retry-link:hover {
      background-color: #30363d;
      text-decoration: underline;
    }

    #share-box {
      margin-top: 40px;
      text-align: center;
    }

    .share-icon {
      width: 48px;
      height: 48px;
      margin: 0 8px;
      transition: transform 0.2s ease;
    }

    .share-icon:hover {
      transform: scale(1.15);
    }
  </style>
</head>
<body>
  <ins class="adsbygoogle"
     style="display:block; text-align:center;"
     data-ad-client="ca-pub-XXXX"
     data-ad-slot="1234567890"
     data-ad-format="auto"

<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

  <h1>Rice Purity Test Score</h1>
  <div class="score" id="scoreDisplay"></div>
  <div class="badge" id="badgeTitle"></div>
  <div class="message-box" id="customMessage"></div>
  <div class="image-frame" id="resultImage"></div>

  <!-- Share Icons -->
  <div id="share-box">
  <h3>📢 Share Your Result!</h3>
  <p>📸 Take a screenshot and share it on:</p>

  <a href="https://wa.me/?text=I%20just%20took%20the%20Sri%20Lankan%20Rice%20Purity%20Test!%20Take%20a%20screenshot%20of%20your%20result%20and%20share%20yours%20too!" target="_blank" title="Share on WhatsApp">
    <img src="https://img.icons8.com/color/48/whatsapp--v1.png" alt="WhatsApp" class="share-icon" />
  </a>

  <a href="https://www.facebook.com/sharer/sharer.php?u=https://your-website.com" target="_blank" title="Share on Facebook">
    <img src="https://img.icons8.com/color/48/facebook-new.png" alt="Facebook" class="share-icon" />
  </a>

  <a href="https://t.me/share/url?url=https://your-website.com&text=Check%20out%20my%20Rice%20Purity%20Test%20result!" target="_blank" title="Share on Telegram">
    <img src="https://img.icons8.com/color/48/telegram-app.png" alt="Telegram" class="share-icon" />
  </a>

  <a href="https://www.instagram.com" target="_blank" title="Share on Instagram (upload screenshot manually)">
    <img src="https://img.icons8.com/color/48/instagram-new--v1.png" alt="Instagram" class="share-icon" />
  </a>

  <a href="viber://forward?text=I%20just%20took%20the%20Sri%20Lankan%20Rice%20Purity%20Test!%20https://your-website.com" title="Share on Viber">
    <img src="https://img.icons8.com/color/48/viber.png" alt="Viber" class="share-icon" />
  </a>
</div>


  <a href="index.html" class="retry-link">← Take the test again</a>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const score = parseInt(urlParams.get("score")) || 0;
    document.getElementById("scoreDisplay").textContent = `${score}/100`;

    let title = '', message = '', imageSrc = '';

    if (score >= 90) {
      title = "Sirimath";
      message = `<p><strong>🌟 You’re the real-life Sirimath — pure as heaven.</strong></p>
        <p>Society needs more people like you. <em>If over 50% of the world were like you</em>, the planet would be a better place.</p>
        <p><strong>👏 Keep being a light in this wild world.</strong> You’re a hero. ✨</p>`;
      imageSrc = "https://i.imgur.com/0E8e15n.jpeg";
    } else if (score >= 75) {
      title = "Not Bad";
      message = `<p><strong>😎 You're doing better than most.</strong></p>
        <p>You’ve made some choices, had some fun, but still kept your morals in check.</p>
        <p><em>Keep it balanced, you're doing fine.</em> 👍</p>`;
      imageSrc = "https://i.imgur.com/394e7z9.png";
    } else if (score >= 50) {
      title = "You’ve Seen Things";
      message = `<p><strong>😏 You’ve definitely got stories.</strong></p>
        <p>A little danger, a little drama. Not the purest soul, but interesting for sure.</p>
        <p><em>You're walking chaos — and we love it.</em></p>`;
      imageSrc = "https://i.imgur.com/FTKc50J.jpeg";
    } else if (score >= 25) {
      title = "Certified Menace";
      message = `<p><strong>🔥 You didn’t dip into chaos — you swam in it.</strong></p>
        <p><em>You made Sirimath faint.</em> 💀</p>
        <p>Maybe drink some water and rethink some decisions. 🧠</p>`;
      imageSrc = "https://i.imgur.com/kfeYGlu.png";
    } else {
      title = "Get Some Help (WTF)";
      message = `<p><strong>🚨 This isn’t a Rice Purity score — it’s a criminal record.</strong></p>
        <p><em>You’ve unlocked achievements most people don’t even know exist.</em> 🤯</p>
        <p>But hey, it’s not too late. <strong>Start by clearing your browser history. 🧹</strong></p>
        <p>You're still worthy. It’s just a test. 💗</p>`;
      imageSrc = "https://i.imgur.com/AytWOPc.png";
    }

    document.getElementById("badgeTitle").textContent = title;
    document.getElementById("customMessage").innerHTML = message;
    document.getElementById("resultImage").innerHTML = `<img src="${imageSrc}" alt="Result Image">`;
  </script>
</body>
</html>
